name: pki-signature-lab
services:
  tls-init:
    build: .
    command: [python, tls_setup.py]
    environment:
      PKI_CA_PASSWORD: ${PKI_CA_PASSWORD:?Ejecuta python init_env.py}
      PKI_DATA_DIR: /app/data
      PKI_TLS_DIR: /app/tls
    volumes:
      - pki-data:/app/data
      - tls-data:/app/tls
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  pki:
    build: .
    environment:
      PKI_ADMIN_TOKEN: ${PKI_ADMIN_TOKEN:?Ejecuta python init_env.py}
      PKI_CA_PASSWORD: ${PKI_CA_PASSWORD:?Ejecuta python init_env.py}
      PKI_DATA_DIR: /app/data
      BIND_HOST: 0.0.0.0
    expose: ["5005"]
    depends_on:
      tls-init:
        condition: service_completed_successfully
    volumes:
      - pki-data:/app/data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:5005/health')"]
      interval: 10s
      retries: 10
  proxy:
    image: nginx:1.28.3-alpine
    user: "10001:10001"
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:8085:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - tls-data:/etc/nginx/tls:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      pki:
        condition: service_healthy
volumes:
  pki-data:
  tls-data:
