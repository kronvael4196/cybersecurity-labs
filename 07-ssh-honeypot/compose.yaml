name: honeypot-lab
services:
  honeypot:
    build: .
    environment:
      HONEYPOT_HOST: 0.0.0.0
      GEO_ENABLED: ${GEO_ENABLED:-false}
    ports: ["127.0.0.1:${HONEYPOT_HOST_PORT:-2223}:2222"]
    volumes: ["honeypot-logs:/app/logs", "honeypot-data:/app/data"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
volumes:
  honeypot-logs:
  honeypot-data:
