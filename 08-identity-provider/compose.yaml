name: identity-lab
services:
  key-init:
    image: python:3.12-slim
    network_mode: none
    volumes:
      - ./data/signing.key:/source/signing.key:ro
      - identity-keys:/keys
    command:
      - python
      - -c
      - "import shutil,os; shutil.copyfile('/source/signing.key','/keys/signing.key'); os.chown('/keys/signing.key',10001,10001); os.chmod('/keys/signing.key',0o400)"
  identity:
    build: .
    depends_on:
      key-init:
        condition: service_completed_successfully
    environment:
      IDP_USERNAME: ${IDP_USERNAME:-analyst}
      IDP_PASSWORD_HASH: ${IDP_PASSWORD_HASH:?Ejecuta scripts/init_labs.py}
      IDP_ADMIN_TOKEN: ${IDP_ADMIN_TOKEN:?Ejecuta scripts/init_labs.py}
      IDP_KEY_PATH: /run/keys/signing.key
      IDP_DB: /app/data/revocations.sqlite3
      IDP_SCOPES: "pki:read pki:sign"
    ports: ["127.0.0.1:8001:8001"]
    volumes:
      - identity-data:/app/data
      - identity-keys:/run/keys:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  identity-data:
  identity-keys:
